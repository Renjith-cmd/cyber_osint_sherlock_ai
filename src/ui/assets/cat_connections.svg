<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Connected Group of Detective Cats (Entity Resolution & Graph) -->
  <circle cx="100" cy="100" r="92" fill="#FBF9F5" stroke="#EBE4DC" stroke-width="2"/>

  <!-- Connecting dashed graph lines -->
  <line x1="60" y1="120" x2="140" y2="120" stroke="#F5B18D" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="60" y1="120" x2="100" y2="60" stroke="#191629" stroke-width="2.5"/>
  <line x1="140" y1="120" x2="100" y2="60" stroke="#191629" stroke-width="2.5"/>

  <!-- Top Cat (Mini) -->
  <g transform="translate(100, 60)">
    <circle cx="0" cy="0" r="24" fill="#191629"/>
    <!-- Ears -->
    <polygon points="-16,-12 -20,-30 -4,-18" fill="#191629"/>
    <polygon points="16,-12 20,-30 4,-18" fill="#191629"/>
    <!-- Eyes -->
    <circle cx="-7" cy="-2" r="4" fill="#FFFFFF"/>
    <circle cx="-6.5" cy="-2" r="2.5" fill="#191629"/>
    <circle cx="7" cy="-2" r="4" fill="#FFFFFF"/>
    <circle cx="6.5" cy="-2" r="2.5" fill="#191629"/>
    <!-- Badge -->
    <circle cx="0" cy="14" r="5" fill="#F5B18D"/>
  </g>

  <!-- Left Cat (Mini Watson) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="26" fill="#191629"/>
    <!-- Ears -->
    <polygon points="-16,-14 -22,-32 -4,-20" fill="#191629"/>
    <polygon points="16,-14 22,-32 4,-20" fill="#191629"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-2" r="4.5" fill="#FFFFFF"/>
    <circle cx="-7.5" cy="-2" r="2.8" fill="#191629"/>
    <circle cx="8" cy="-2" r="4.5" fill="#FFFFFF"/>
    <circle cx="7.5" cy="-2" r="2.8" fill="#191629"/>
    <!-- Bowtie -->
    <polygon points="-6,15 0,17 -6,19" fill="#F5B18D"/>
    <polygon points="6,15 0,17 6,19" fill="#F5B18D"/>
  </g>

  <!-- Right Cat (Mini Corporate) -->
  <g transform="translate(140, 120)">
    <circle cx="0" cy="0" r="26" fill="#191629"/>
    <!-- Ears -->
    <polygon points="-16,-14 -22,-32 -4,-20" fill="#191629"/>
    <polygon points="16,-14 22,-32 4,-20" fill="#191629"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-2" r="4.5" fill="#FFFFFF"/>
    <circle cx="-7.5" cy="-2" r="2.8" fill="#191629"/>
    <circle cx="8" cy="-2" r="4.5" fill="#FFFFFF"/>
    <circle cx="7.5" cy="-2" r="2.8" fill="#191629"/>
    <!-- Tie -->
    <polygon points="-3,14 3,14 1,22 -1,22" fill="#F5B18D"/>
  </g>
</svg>
