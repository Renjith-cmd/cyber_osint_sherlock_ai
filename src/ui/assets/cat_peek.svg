<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <!-- Bottom Corner Peeking Detective Cat with Organic Cream Wave -->
  <!-- Background organic cream wave/blob -->
  <path d="M 0 160 C 20 120, 60 100, 100 130 C 140 160, 180 140, 200 180 C 220 220, 180 260, 0 260 Z" fill="#F7F4F0" opacity="0.95"/>
  <path d="M 0 200 C 40 170, 90 190, 130 220 C 160 240, 120 260, 0 260 Z" fill="#EFE8DE" opacity="0.6"/>

  <!-- Peeking Cat Head -->
  <g transform="translate(60, 110)">
    <!-- Left Ear -->
    <polygon points="12,50 4,14 36,32" fill="#191629"/>
    <polygon points="12,46 7,20 30,34" fill="#F7F4F0"/>
    <!-- Right Ear -->
    <polygon points="68,50 76,14 44,32" fill="#191629"/>
    <polygon points="68,46 73,20 50,34" fill="#F7F4F0"/>

    <!-- Head -->
    <ellipse cx="40" cy="56" rx="34" ry="28" fill="#191629"/>

    <!-- Curious Big Eyes peeking over -->
    <circle cx="28" cy="52" r="7.5" fill="#FFFFFF"/>
    <circle cx="29" cy="52" r="4.8" fill="#191629"/>
    <circle cx="27" cy="49" r="2.2" fill="#FFFFFF"/>

    <circle cx="52" cy="52" r="7.5" fill="#FFFFFF"/>
    <circle cx="51" cy="52" r="4.8" fill="#191629"/>
    <circle cx="49" cy="49" r="2.2" fill="#FFFFFF"/>

    <!-- Nose & Mouth -->
    <polygon points="40,62 38,58 42,58" fill="#F5B18D"/>
    <path d="M 40 62 Q 37 66, 34 64" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 40 62 Q 43 66, 46 64" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="16" y1="58" x2="0" y2="56" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="16" y1="63" x2="-2" y2="66" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="64" y1="58" x2="80" y2="56" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="64" y1="63" x2="82" y2="66" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Tiny Paws resting on the wave rim -->
    <ellipse cx="22" cy="78" rx="8" ry="6" fill="#191629"/>
    <circle cx="18" cy="76" r="1.8" fill="#FFFFFF"/>
    <circle cx="22" cy="74" r="1.8" fill="#FFFFFF"/>
    <circle cx="26" cy="76" r="1.8" fill="#FFFFFF"/>

    <ellipse cx="58" cy="78" rx="8" ry="6" fill="#191629"/>
    <circle cx="54" cy="76" r="1.8" fill="#FFFFFF"/>
    <circle cx="58" cy="74" r="1.8" fill="#FFFFFF"/>
    <circle cx="62" cy="76" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
